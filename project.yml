# ============================================================
# YDS Kelimelerim — XcodeGen proje tanımı
#
# .xcodeproj dosyası depoda TUTULMAZ; bu dosyadan üretilir.
# Sebebi: project.pbxproj birleştirilemez bir ikili gibidir, sürüm
# kontrolünde sürekli çakışır ve Mac'siz düzenlenemez. Buradan
# üretmek, yapılandırmayı okunabilir ve gözden geçirilebilir tutar.
#
#   brew install xcodegen && xcodegen generate
# ============================================================

name: YDSKelimelerim

options:
  bundleIdPrefix: com.ustuner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  findCarthageFrameworks: false

configs:
  Debug: debug
  Release: release

# Yapılandırma dosyası proje düzeyinde: tüm hedefler aynı değerleri görür.
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

# ------------------------------------------------------------
# Tüm hedefler için ortak derleyici ayarları
# ------------------------------------------------------------
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Manual                # CI'da otomatik imza yok
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES

# ------------------------------------------------------------
# Bağımlılıklar
#
# Sürüm 12.x'e sabitlendi. 13.0.0 (Şub 2026) kırıcı değişiklikler
# içeriyor; yükseltme README'deki "SDK yükseltme" bölümünde anlatılıyor.
# Paket, UserMessagingPlatform (UMP) çerçevesini de birlikte getirir.
# ------------------------------------------------------------
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    majorVersion: 12.0.0

targets:
  # ==========================================================
  # Uygulama
  # ==========================================================
  YDSKelimelerim:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Sources/Services
      - path: Sources/DesignSystem
      - path: Sources/Features
      - path: Resources/Data/deck.json
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: GoogleMobileAds
      - target: YDSWidgetExtension
        embed: true
    info:
      path: App/Info.plist
    entitlements:
      path: App/YDSKelimelerim.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: YDSKelimelerim      # görünen ad Info.plist'teki CFBundleDisplayName
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROVISIONING_PROFILE)
        CODE_SIGN_IDENTITY: $(CODE_SIGN_IDENTITY_APP)
        ENABLE_BITCODE: NO
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig

  # ==========================================================
  # Ana ekran widget'ı
  # ==========================================================
  YDSWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Core/Models
      - path: Sources/Core/Data
      - path: Sources/Core/SpacedRepetition
      - path: Sources/DesignSystem/Theme.swift
      # deck.json widget'a DAHİL DEĞİL: widget yalnızca uygulamanın
      # yazdığı küçük özeti okur. 220 KB'lik desteyi eklentiye kopyalamak
      # gereksiz yer kaplar ve widget bellek sınırını zorlar.
      - path: Resources/Assets.xcassets
    info:
      path: Widget/Info.plist
    entitlements:
      path: Widget/YDSWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        PRODUCT_NAME: YDSWidgetExtension
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROVISIONING_PROFILE)
        CODE_SIGN_IDENTITY: $(CODE_SIGN_IDENTITY_APP)
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig

  # ==========================================================
  # Birim testleri
  # ==========================================================
  YDSKelimelerimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Resources/Data/deck.json
        buildPhase: resources
    dependencies:
      - target: YDSKelimelerim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/YDSKelimelerim.app/YDSKelimelerim
        BUNDLE_LOADER: $(TEST_HOST)
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig

schemes:
  YDSKelimelerim:
    build:
      targets:
        YDSKelimelerim: all
        YDSWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - YDSKelimelerimTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
